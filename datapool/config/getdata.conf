        </ULTRA>
        <IG3>
            name IGS repro3 earth rotation parameters
            filename ig3[wwww][d].erp.Z
            compression compress
            path  erp/final/[wwww]
        </IG3>
    </ERP>
    <CLK>
        <COD_FIN>
            name Final clock file
