                    path  [JOB]/ORB
                </RAPID>
                <ULTRA>
                    priority 2
                    filename IGU_[WWWW][d][HH].IEP
                    compression none
                    path  [JOB]/ORB
                </ULTRA>
            </ERP>
            <CLK>
                <COD_FIN>
                    priority 4
                    #filename COD[YYYY][DDD].CLK
                    filename COD0OPSFIN_[YYYY][DDD].CLK                   
                    compression none
                    path  [JOB]/OUT
                </COD_FIN>
                <COD_RAP>
                    priority 4
                    #filename COR[YYYY][DDD].CLK
                    filename COD0OPSRAP_[YYYY][DDD].CLK                  
                    compression none
                    path  [JOB]/OUT
                </COD_RAP>
                <CODE_MGEX>
                    #filename COM[wwww][d].CLK
                    filename COD0MGXFIN_[YYYY][DDD].CLK                  
                    compression none
                    path [JOB]/OUT
                </CODE_MGEX>
                 <FINAL>
                    priority 4
                    filename IGS[YYYY][DDD]0.CLK
                    compression none
                    path  [JOB]/OUT
                </FINAL>
                <RAPID>
                    priority 3
                    filename IGR[YYYY][DDD]0.CLK
                    compression none
                    path  [JOB]/OUT
                </RAPID>
                <CO3>
                    name Observation Specific Bias file
                    priority 4 
                    filename CO3[YYYY][DDD]0.CLK
                    compression none
                    path [JOB]/OUT
                </CO3>
                <IG3>
                    name Observation Specific Bias file
                    priority 4 
                    filename IG3[YYYY][DDD]0.CLK
                    compression none
                    path [JOB]/OUT
                </IG3>
            </CLK>
            <ION>
