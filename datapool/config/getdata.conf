                </COD_FIN>
                <COD_RAP>
                    #filename COR_[wwww][d].IEP
                    filename COD0OPSRAP_[YYYY][DDD].IEP
                    compression none 
                    path [JOB]/ORB
                </COD_RAP>
                <CODE_MGEX>
                    #filename COM[wwww][d].IEP
                    filename COD0MGXFIN_[YYYY][DDD].IEP                    
                    compression none
                    path [JOB]/ORB
                </CODE_MGEX>
                <CO3>
                    filename CO3_[wwww][d].IEP
                    compression none
                    path [JOB]/ORB
                </CO3>
                <IG3>
                    filename IG3_[wwww][d].IEP
                    compression none
                    path [JOB]/ORB
                </IG3>
                <FINAL>
                    priority 4
                    filename IGS_[WWWW][d].IEP
                    compression none
                    path  [JOB]/ORB
                </FINAL>
                <RAPID>
                    priority 3
                    filename IGR_[WWWW][d].IEP
