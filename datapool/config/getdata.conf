                </COD_RAP>
                <CODE_MGEX>
                    #filename COM[wwww][d].PRE
                    filename COD0MGXFIN_[YYYY][DDD].PRE                    
                    compression none
                    path [JOB]/ORB
                </CODE_MGEX>
                <CO3>
                    filename CO3_[YYYY][DDD]0.PRE
                    compression none
                    path [JOB]/ORB
                </CO3>
                <IG3>
                    filename IG3_[YYYY][DDD]0.PRE
                    compression none
                    path [JOB]/ORB
                </IG3>
                <FINAL>
                    priority 4
                    filename COD0OPSFIN_[YYYY][DDD].PRE
                    compression none
                    path  [JOB]/ORB
                </FINAL>
                <RAPID>
                    priority 3
                    filename COD0OPSRAP_[YYYY][DDD].PREE
                    compression none
                    path  [JOB]/ORB
                </RAPID>
                <ULTRA>
                    priority 2
                    filename IGU_[YYYY][DDD][HH].PRE
                    compression none
                    path  [JOB]/ORB
