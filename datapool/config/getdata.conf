    <DataCenter>
        priority 20
        name GGOS
        Uri https://vmf.geo.tuwien.ac.at
        <DataFiles>
            <VMF>
                <VMF1>
                    filename VMFG_[yyyy][mm][dd].H[hh]
                    compression none
                    latency 8 hours
                    path /trop_products/GRID/2.5x2/VMF1/VMF1_OP/[yyyy]
                </VMF1>
                <VMF3>
                    filename VMF3_[yyyy][mm][dd].H[hh]
                    compression none
                    latency 8 hours
                    path /trop_products/GRID/1x1/VMF3/VMF3_OP/[yyyy]
                </VMF3>
            </VMF>
        </DataFiles>
    </DataCenter>


    # Second GGOS site: deals with gzipped files from 1997 through 2008
    <DataCenter>
        priority 19
        name GGOS_2
        Uri https://vmf.geo.tuwien.ac.at
        <DataFiles>
            <VMF>
                <VMF1>
                    filename VMFG_[yyyy][mm][dd].H[hh].gz
                    latency 8 hours
                    path /trop_products/GRID/2.5x2/VMF1/VMF1_OP/[yyyy]
                    compression gzip
                </VMF1>
            </VMF>
        </DataFiles>
    </DataCenter>


    <DataCenter>
        priority 0
        Name Cache
        Stations *
        Uri  ${GNSS_PRODUCTS_CACHE_URL||file://${D}}
    </DataCenter>


    <DataCenter>
        priority 0
        name bernese
        Stations *
        Uri file://${P}
        <DataFiles>
            <OBS>
                <DAILY>
                    priority 2
                    #filename [SSSS][DDD]0.[YY]O
                    filename [SSSS]00XYZ_[YYYY][DDD]0.RXO
                    compression none
                    path  [JOB]/RAW
                </DAILY>
                <HOURLY>
                    priority 1
                    filename [SSSS][DDD][H].[YY]O
                    compression none
                    path  [JOB]/RAW
                </HOURLY>
            </OBS>
            <ORB>
                <BROADCAST>
                    filename AUTO[ddd]0.[yy]N
                    compression none
                    path  [JOB]/RAW
                </BROADCAST>
                <COD_FIN>
                    #filename COD_[YYYY][DDD]0.PRE
                    filename COD0OPSFIN_[YYYY][DDD].PRE                    
                    compression none 
                    path [JOB]/ORB
                </COD_FIN>
                <COD_RAP>
                    #filename COR_[YYYY][DDD]0.PRE
                    filename COD0OPSRAP_[YYYY][DDD].PRE                    
